# Rocket Profile Analysis - configuration (merged over rpa/config.py DEFAULTS).
# Copied to config.yaml on first save from the GUI; config.yaml is git-ignored.

paths:
  ork: null                       # OpenRocket model (.ork); any path, set here or from the GUI
  cdx1: null                      # RASAero model (.CDX1)
  boosters: []                    # folders and/or .eng/.ric files; every motor found is a candidate
  sustainers: []                  # same, for sustainer candidates
  output_dir: "output"
  jobs_dir: "jobs"                # shared with the VM (Z:\jobs)
  aero_dir: "input/aero"          # written by `rpa aero`: <stack|sustainer>_alt<ft>[_noz<in>].csv
  reference_dir: "input/rasaero_reference"   # written by `rpa reference`, read by `rpa validate`
  openrocket_jar: "/Applications/OpenRocket.app/Contents/Resources/app/jar/OpenRocket-24.12.jar"
  jvm: "/Applications/OpenRocket.app/Contents/Resources/jre.bundle/Contents/Home/lib/server/libjvm.dylib"

target:
  apogee_ft: 45000
  tolerance_ft: 100

profiles:
  subsonic_max_mach: 0.9          # profile 1: stack never exceeds this during boost
  supersonic_min_mach: 1.2        # profile 2: separation must happen at or above this
  mach_margin: 0.05               # design margin applied to both limits
  separation_delay_min_s: 0.5     # booster separation window, seconds after booster burnout (0 = at burnout)
  separation_delay_max_s: 5
  separation_step_s: 0.25          # separation delays tried inside the window (min, min+step, ..., max)
  ignition_delay_min_s: 0.5       # sustainer ignition window, seconds after separation
  ignition_delay_max_s: 5        # ignition MUST NOT precede burnout: both delays floor at 0
  coarse_step_s: 0.25              # ignition delays tried inside the window before the bracket refinement
  max_refine_rounds: 4
  min_ignition_velocity_fps: 0    # verification only; 0 disables
  include_decel_subsonic: false   # optional 3rd variant: coast attached below Mach 0.9, then separate

characterization:               # long-coast run used to measure the attached stack
  separation_delay_s: 15.0        # after booster burnout
  ignition_delay_s: 15.0          # after separation (RASAero convention)

sustainer_selection:            # which sustainer candidates are flown with every booster
  mode: span                      # best = max-impulse only | span = `count` spread over apogee effect | list = `labels`
  count: 10                        # span: min, max and evenly spaced between (measured on one reference booster)
  labels: []                      # list: exact sustainer labels

launch_site:                    # null = keep the value in the CDX1 file
  altitude_ft: null
  pressure_inhg: null
  rod_angle_deg: null
  rod_length_ft: null
  temperature_f: null
  wind_speed_mph: null

surface_finish: "Rough Camouflage Paint"

rasaero:
  engine_name_format: "{designation}  ({manufacturer})"   # how RASAero names motors in <Booster1Engine>
  rows_per_batch: 100
  export_time_base_s: 0.01
  altitude_reference: auto        # auto (detect from the first export) | agl | msl
  sustainer_nozzle_in: null       # null = parse "exit x.xxx in" from the .eng comment header
  booster_nozzle_in: null
  mach_alt_via_cdx1: false        # opt-in speedup: pre-write <MachAlt> instead of the dialog - verify on the VM first
  engine: auto                    # where RASAero runs for aero/reference/confirm: auto (native if built) | native | vm

native:                           # RASAero's engine in child processes (native/, rpa/native.py)
  dt_s: 0.01
  timeout_s: 600
  rows_per_batch: 200
  workers: auto                   # engine host processes (auto = every core, 1 = serial)
  shared: true                    # keep the hosts alive between stages
  warm_start: true                # the app starts the hosts and the JVM at launch

mass_model:
  method: openrocket              # openrocket | manual
  hardware_mass_lb: null          # dry mass, lb; .ork stage dry masses scale to it, .eng prop
                                  # masses add on top. null = keep the .ork masses as-is
  manual:                         # used only when method: manual
    sustainer_wt_lb: null
    sustainer_cg_in: null
    combined_wt_lb_ref: null      # combined weight with the reference booster loaded
    combined_cg_in_ref: null
    ref_booster_prop_kg: null
    booster_prop_cg_in: null      # axial station (from nose tip) of the booster propellant CG

backend: rasaero_native           # rasaero_native (RASAero's engine, bundled) | python (RASAero tables) | rasaero (VM GUI) | openrocket (preview)

python_sim:                       # RASAero's flight loop in Python (rpa/flightsim.py)
  dt_s: 0.01
  max_time_s: 400
  ref_diameter_in: null           # null = largest body diameter found in the CDX1
  workers: auto                   # CPU processes for the search batches (auto = cores - 1, 1 = serial)

aero_tables:                      # `rpa aero`: Aero Plots exports (once per vehicle revision)
  altitudes_ft: [0, 5000, 10000, 15000, 20000, 25000, 30000, 35000, 40000, 45000, 50000, 55000, 60000, 65000, 70000, 75000, 80000, 85000, 90000, 95000, 100000]
                                  # Mach-Alt altitude per table; CD follows the Reynolds number, 5000 ft steps keep apogee within ~0.01 %
  stack_nozzles_in: auto          # auto = largest booster nozzle (power-on CD scales exactly to any nozzle)
  sustainer_nozzles_in: auto      # auto = largest sustainer nozzle
  plot_range: "Mach 5"
  batch_altitudes: true          # opt-in speedup: all altitudes of one nozzle in one worker job - verify on the VM first

validation:                       # `rpa validate` pass criteria vs RASAero reference exports
  apogee_tol_pct: 0.1
  mach_tol: 0.001
  cd_tol_pct: 0.5
  weight_tol_lb: 0.01
  mach_at_burnout_tol: 0.002

worker:
  mode: auto                      # auto = VM worker polls jobs/ ; manual = you drive RASAero by hand
  transport: auto                 # agent (guest agent) | share (Z: WebDAV); auto picks agent if utmctl found
  poll_s: 1.5
  timeout_s: 3600
  max_retries: 2
  batch_reference_export: true   # opt-in speedup: one job for every `rpa reference` flight - verify on the VM first

ranking:
  metric: vel_at_ign_fps          # column of designs.csv to rank feasible designs by
  descending: true

ric:                             # openMotor .ric designs as motor input (cached under output/motors/ric_cache)
  openmotor: auto                 # motorlib folder; auto: install, $OPENMOTOR_PATH, or sibling vendor/openMotor
  timestep_s: 0.002               # openMotor timestep for the thrust curves

vm:                             # GUI "Start VM worker" button: boots the UTM VM and starts the worker inside it
  name: "Windows"                 # UTM virtual machine name (utmctl list)
  utmctl: auto                    # path to utmctl; auto = /Applications/UTM.app/Contents/MacOS/utmctl
  share_drive: "Z:"               # this repo as seen from inside the VM
  task_name: RPAWorker            # Windows task that runs the worker on the desktop (no spaces)
  python: auto                    # python.exe in the VM; auto = the logged-on user's python.org install
  boot_timeout_s: 240
